name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.6.0

      - name: Check for duplicate associations
        run: node --experimental-strip-types scripts/duplicates.ts

      - name: Generate and check theme assets
        run: |
          node --experimental-strip-types scripts/generate.ts
          git diff --exit-code
